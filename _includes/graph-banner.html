<script>
// Connected 3D network graph drawn behind the title banner.
// Node colours cycle through the first five entries of the _brand.yml
// palette; edges share one fixed colour. The graph rotates slowly about
// both axes. Hovering steers it: horizontal mouse position sets the spin
// around the vertical axis, vertical position the spin around the
// horizontal axis (further from the centre = faster). Clicking on the
// banner adds a new node at the pointer, linked to its nearest neighbours.
(function () {
  var PALETTE = ["#21260F", "#46503D", "#D2D4D1", "#400101", "#BF4545"];
  var EDGE_COLOR = "#D2D4D1";
  var N_NODES = 5;         // nodes at start; more are added by clicking
  var K_NEIGHBOURS = 3;
  var NODE_RADIUS = 3.5;   // base radius (px); scaled by perspective
  var NODE_RADIUS_MIN = 2.5;
  var BASE_SPEED_Y = 0.12; // idle spin around the vertical axis (rad/s)
  var BASE_SPEED_X = 0.05; // idle spin around the horizontal axis (rad/s)
  var MAX_SPEED = 1.2;     // spin at the canvas edge while hovering (rad/s)
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function init() {
    var banner = document.querySelector(".quarto-title-banner");
    if (!banner) return;
    var hosts = [banner];

    var canvases = hosts.map(function (host) {
      var c = document.createElement("canvas");
      c.className = "graph-canvas";
      c.setAttribute("aria-hidden", "true");
      host.insertBefore(c, host.firstChild);
      return { el: c, host: host, ctx: c.getContext("2d"), offsetY: 0, w: 0, h: 0 };
    });

    // ---- build a connected graph ----
    // Every node is added through addNode(), which links it to its
    // K_NEIGHBOURS nearest existing nodes. Since each newcomer attaches to
    // the existing graph, the graph stays connected without a repair step.
    var rng = mulberry32(20260911);
    var nodes = [], edges = [], seen = {};
    function addEdge(a, b) {
      var key = a < b ? a + "-" + b : b + "-" + a;
      if (a === b || seen[key]) return;
      seen[key] = true;
      edges.push({ a: a, b: b });
    }
    function addNode(x, y, z) {
      var i = nodes.length;
      var n = { x: x, y: y, z: z, color: PALETTE[i % PALETTE.length] };
      var d = nodes.map(function (m, j) { return { j: j, d: dist(n, m) }; })
        .sort(function (p, q) { return p.d - q.d; });
      nodes.push(n);
      for (var k = 0; k < K_NEIGHBOURS && k < d.length; k++) addEdge(i, d[k].j);
      return i;
    }
    for (var i = 0; i < N_NODES; i++) {
      // roughly uniform inside a sphere, stretched horizontally later
      var u = rng() * 2 - 1, t = rng() * Math.PI * 2, r = Math.cbrt(rng());
      var s = Math.sqrt(1 - u * u);
      addNode(r * s * Math.cos(t), r * u, r * s * Math.sin(t));
    }

    // ---- animation state ----
    var angleY = 0, angleX = 0.35;
    var speedY = BASE_SPEED_Y, speedX = BASE_SPEED_X;
    var targetY = BASE_SPEED_Y, targetX = BASE_SPEED_X;
    var totalW = 0, totalH = 0, dpr = 1;
    var PERSP_A = 1.35, PERSP_B = 0.35; // persp = 1 / (PERSP_A - z * PERSP_B)

    // The graph is centred in the right half of the banner on wider
    // screens (the title sits on the left); on narrow screens it spans
    // the full width. One scale is used for both screen axes so the
    // node cloud stays a sphere rather than an ellipsoid that appears to
    // squash and stretch as it rotates; the scale is the smaller of what
    // the available width and height allow.
    function viewScale() {
      var right = totalW >= 768;
      var sx = right ? totalW * 0.45 : totalW * 0.9;
      var sy = Math.max(totalH * 0.85, 90);
      return {
        cx: right ? totalW * 0.75 : totalW / 2,
        cy: totalH / 2,
        s: Math.min(sx, sy)
      };
    }

    // Map a click on a canvas back into model space: undo the perspective
    // at a random depth, then undo the current rotation so the node stays
    // where it was clicked while the graph keeps spinning.
    function addNodeAt(evt, c) {
      var r = c.el.getBoundingClientRect();
      var px = evt.clientX - r.left, py = evt.clientY - r.top + c.offsetY;
      var v = viewScale();
      var z = (rng() * 2 - 1) * 0.6;
      var persp = 1 / (PERSP_A - z * PERSP_B);
      var x = (px - v.cx) / (v.s * persp), y = (py - v.cy) / (v.s * persp);
      // inverse of the X rotation, then of the Y rotation used in frame()
      var ct = Math.cos(angleX), st = Math.sin(angleX);
      var y0 = y * ct + z * st, z1 = -y * st + z * ct;
      var ca = Math.cos(angleY), sa = Math.sin(angleY);
      var x0 = x * ca + z1 * sa, z0 = -x * sa + z1 * ca;
      addNode(x0, y0, z0);
    }

    function layout() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      var top = Infinity;
      canvases.forEach(function (c) {
        var r = c.host.getBoundingClientRect();
        c.w = r.width; c.h = r.height; c.offsetY = r.top;
        if (r.top < top) top = r.top;
        c.el.width = Math.round(r.width * dpr);
        c.el.height = Math.round(r.height * dpr);
      });
      totalW = 0; totalH = 0;
      canvases.forEach(function (c) {
        c.offsetY -= top;
        totalW = Math.max(totalW, c.w);
        totalH = Math.max(totalH, c.offsetY + c.h);
      });
    }

    function steer(evt, c) {
      var r = c.el.getBoundingClientRect();
      var nx = ((evt.clientX - r.left) / r.width - 0.5) * 2;   // -1 .. 1
      var ny = ((evt.clientY - r.top) / r.height - 0.5) * 2;   // -1 .. 1
      targetY = nx * MAX_SPEED;
      targetX = ny * MAX_SPEED * 0.6;
    }
    canvases.forEach(function (c) {
      c.host.addEventListener("mousemove", function (e) { steer(e, c); });
      c.host.addEventListener("mouseleave", function () { targetY = BASE_SPEED_Y; targetX = BASE_SPEED_X; });
      c.host.addEventListener("click", function (e) {
        // leave links and buttons inside the banner alone
        if (e.target.closest && e.target.closest("a, button")) return;
        addNodeAt(e, c);
      });
    });

    var last = performance.now();
    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!reduced) {
        var ease = Math.min(1, dt * 2.5);
        speedY += (targetY - speedY) * ease;
        speedX += (targetX - speedX) * ease;
        angleY += speedY * dt;
        angleX += speedX * dt;
      }

      // project once in combined coordinates
      var v = viewScale();
      var cx = v.cx, cy = v.cy, scale = v.s;
      var ca = Math.cos(angleY), sa = Math.sin(angleY), ct = Math.cos(angleX), st = Math.sin(angleX);
      var proj = nodes.map(function (n) {
        var x = n.x * ca - n.z * sa, z = n.x * sa + n.z * ca;
        var y = n.y * ct - z * st; z = n.y * st + z * ct;
        var persp = 1 / (PERSP_A - z * PERSP_B);
        return { x: cx + x * scale * persp, y: cy + y * scale * persp, z: z, p: persp, color: n.color };
      });

      canvases.forEach(function (c) {
        var ctx = c.ctx;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Clear rather than fill so the CSS gradient on the banner shows through.
        ctx.clearRect(0, 0, c.w, c.h);
        ctx.translate(0, -c.offsetY);
        ctx.lineCap = "round";
        ctx.strokeStyle = EDGE_COLOR;
        edges.forEach(function (e) {
          var a = proj[e.a], b = proj[e.b];
          var depth = (a.z + b.z) / 2;               // -1 .. 1
          ctx.globalAlpha = 0.18 + 0.32 * (depth + 1) / 2;
          ctx.lineWidth = 0.8 + 1.0 * (depth + 1) / 2;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        });
        // draw far nodes first so near ones sit on top
        proj.slice().sort(function (a, b) { return a.z - b.z; }).forEach(function (p) {
          ctx.globalAlpha = 0.6 + 0.4 * (p.z + 1) / 2;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, NODE_RADIUS_MIN + NODE_RADIUS * p.p, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 0.9;
          ctx.lineWidth = 1;
          ctx.strokeStyle = EDGE_COLOR;
          ctx.stroke();
          ctx.strokeStyle = EDGE_COLOR;
        });
        ctx.globalAlpha = 1;
      });
      requestAnimationFrame(frame);
    }

    layout();
    window.addEventListener("resize", layout);
    // banner size changes when web fonts load; follow it
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(layout);
      hosts.forEach(function (h) { ro.observe(h); });
    } else {
      setTimeout(layout, 500);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
    requestAnimationFrame(frame);
  }

  function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return Math.sqrt(dx * dx + dy * dy + dz * dz); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
